wards:
  - id: protect-data
    kind: path
    deny: [delete, overwrite]
    paths: ["data/**", "db/*.sqlite", ".env"]
  - id: no-data-loss
    kind: sql
    tables: [users, orders]
    max_rows_lost: 0
  - id: no-secret-egress
    kind: egress
    secrets: [".env", "**/*.pem"]
    allow_hosts: [registry.npmjs.org]
safe_commands: [ls, pwd, cat, "git status", "git diff"]
trusted_commands: ["corepack pnpm test", "corepack pnpm typecheck", "corepack pnpm lint", "corepack pnpm build", "corepack pnpm build:site", "corepack pnpm --filter * test", "corepack pnpm --filter * typecheck", "corepack pnpm --filter * lint", "corepack pnpm --filter * build", "corepack pnpm --filter * exec vitest run **", "npx vitest run **", "npx tsc --noEmit **"]
